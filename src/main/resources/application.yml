spring:
  application:
    name: shop-spring
  datasource:
    url: jdbc:mysql://localhost:3306/shop_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootroot}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB

server:
  port: 8088

shop:
  upload:
    images:
      directory:
       path: /Users/armanhambaryan/IdeaProjects/JavaCore/shop-spring/upload_images

logging:
  file:
    name: /Users/armanhambaryan/IdeaProjects/JavaCore/shop-spring/log/spring.log
  logback:
    rollingpolicy:
      max-file-size: 1MB
      max-history: 3
  level:
    root: info
    org.hibernate.sql: DEBUG
    am.itspace.shopspring.controller: DEBUG

