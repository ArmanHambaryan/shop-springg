<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Details - ShopSpring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
<main class="page">
    <th:block th:replace="~{fragments/HeaderFragment::header}"></th:block>

    <div style="margin-bottom: 2.5rem;">
        <a class="btn btn-outline btn-sm" href="/">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            Back to Shop
        </a>
    </div>

    <section class="panel glass" style="padding: 1.5rem;">
        <div class="product-details-grid" style="gap: 4rem;">
            <div class="image-section">
                <div style="background: var(--bg-main); border-radius: var(--radius-lg); overflow: hidden; position: sticky; top: 6rem;">
                    <img class="product-image-main" th:src="@{/image/get(picName=${product.pictureName})}" alt="Product image" style="width: 100%; display: block; transition: var(--transition);">
                </div>
            </div>
            <div class="detail-info" style="padding: 2rem 0;">
                <div class="stack" style="gap: 1rem; margin-bottom: 2.5rem;">
                    <span style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--primary); font-weight: 700; font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.1em;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sparkles"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                        Featured Collection
                    </span>
                    <h1 style="font-size: 3.5rem; line-height: 1.1; margin-top: 0.5rem;" th:text="${product.title}">Product Title</h1>
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <span class="btn btn-secondary btn-sm" style="font-weight: 800; pointer-events: none;" th:text="${product.category.name}">Category</span>
                        <div style="display: flex; color: var(--warning);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            <span style="color: var(--text-light); font-size: 0.8125rem; font-weight: 600; margin-left: 0.5rem;">(4.8)</span>
                        </div>
                    </div>
                </div>
                
                <p class="price-tag" style="font-size: 3rem; margin-bottom: 2rem;">
                    $<span th:text="${product.price}">0.00</span>
                </p>

                <div style="background: var(--bg-main); border-radius: var(--radius-md); padding: 2rem; margin-bottom: 2.5rem; border: 1px solid var(--border);">
                    <h3 style="margin-bottom: 1rem; font-size: 1.125rem; font-weight: 800;">Product Description</h3>
                    <p style="color: var(--text-muted); line-height: 1.8; font-size: 1rem;" th:text="${product.description}"></p>
                </div>

                <div class="detail-meta stack" style="gap: 1.5rem;">
                    <button class="btn btn-primary" style="width: 100%; padding: 1.5rem; font-size: 1.125rem; border-radius: var(--radius-md);">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                        Add to Shopping Bag
                    </button>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border);">
                            <div style="color: var(--secondary);">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-truck"><path d="M5 18a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M18 18a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M13 18H7V6c0-1.1.9-2 2-2h11v12c0 1.1-.9 2-2 2h-1"/><path d="M13 4h-4"/><path d="M13 8h7"/><path d="M13 12h7"/></svg>
                            </div>
                            <div>
                                <strong style="display: block; font-size: 0.8125rem;">Free Delivery</strong>
                                <span style="font-size: 0.75rem; color: var(--text-muted);">Orders over $100</span>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 0.75rem; padding: 1rem; background: #fff; border-radius: var(--radius-md); border: 1px solid var(--border);">
                            <div style="color: var(--accent);">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
                            </div>
                            <div>
                                <strong style="display: block; font-size: 0.8125rem;">2 Year Warranty</strong>
                                <span style="font-size: 0.75rem; color: var(--text-muted);">Full protection</span>
                            </div>
                        </div>
                    </div>

                    <p style="text-align: center; font-size: 0.8125rem; color: var(--text-light); font-weight: 500;">
                        Secure payments guaranteed with 128-bit encryption.
                    </p>
                </div>
            </div>
        </div>
    </section>
</main>

</body>
</html>
