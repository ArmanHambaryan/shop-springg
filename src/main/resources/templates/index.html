<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home Page</title>
</head>
<body>
<div th:if="${user != null}">
    Welcome, <span th:text="${user.name}"></span> | <a href="/logout">Logout</a>
</div>
<div th:unless="${user != null}">
    <a href="/loginPage">Login</a> | <a href="/registerPage">Register</a>
</div>

<div th:each="cat : ${categories}">
    <a th:href="@{'/products/category/' + ${cat.id}}" th:text="${cat.name}">Category Name</a>
</div>

</body>
</html>
