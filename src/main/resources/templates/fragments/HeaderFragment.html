<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Header Fragment</title>
</head>
<body>

<div th:fragment="header">

    <a href="?lang=en">EN</a> |
    <a href="?lang=hy">HY</a> |
    <a href="?lang=ru">RU</a> |

    <div th:if="${user != null}">
        <span th:text="#{main.welcome}"></span>, <span th:text="${user.name}"></span> | <span
            th:text="${user.surname}"></span> | <a href="/logout">Logout</a>
    </div>
    <div th:unless="${user != null}">
        <a href="/loginPage" th:text="#{main.login}"></a> | <a href="/registerPage" th:text="#{main.register}"></a>
    </div>

    <h2><span th:text="#{main.categoryList}"></span></h2>

</div>

</body>
</html>
